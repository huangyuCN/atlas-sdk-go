// gatewayv1 是 SDK 真机冒烟用的最小 gateway 认证协议子集（字段与
// atlas-game-layout api/gateway/v1/auth.proto 对齐；去掉跨包 PlayerSummary
// 引用——LoginReply 仅取 player_id/token，服务端多余字段由解码端忽略）。
// 仅测试用途：真机三编码（json/protojson/protobuf）验证 service op 形态。
syntax = "proto3";

package gateway.v1;

option go_package = "github.com/huangyuCN/atlas-sdk-go/examples/smoke/gatewayv1;gatewayv1";

message RegisterRequest {
  string account = 1;
  string password = 2;
  string nickname = 3;
}

message RegisterReply {
  string player_id = 1;
}

message LoginRequest {
  string player_id = 1;
  string password = 2;
}

message LoginReply {
  string player_id = 1;
  string token = 2;
}

message HeartbeatRequest {
  string token = 1;
  string player_id = 2;
  int64 ts = 3;
}

message HeartbeatReply {
  int64 ts = 1;
  uint64 server_time_unix_ms = 2;
}

// GatewayAuth 是网关认证服务（与模板 op 全名一致：/gateway.v1.GatewayAuth/*）。
service GatewayAuth {
  rpc Register (RegisterRequest) returns (RegisterReply);
  rpc Login (LoginRequest) returns (LoginReply);
  rpc Heartbeat (HeartbeatRequest) returns (HeartbeatReply);
}
