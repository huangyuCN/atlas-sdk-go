name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # 上游仓检出在 $GITHUB_WORKSPACE 下（path: atlas / atlas-game-layout），与
      # gen-dto.sh 默认的「同级目录 ../atlas」布局不同，故显式给绝对路径；
      # 不设这两个变量时脚本会找不到上游仓而失败。
      ATLAS_DIR: ${{ github.workspace }}/atlas
      ATLAS_LAYOUT_DIR: ${{ github.workspace }}/atlas-game-layout
    steps:
      - uses: actions/checkout@v4
      # golden vectors 源在 atlas 主仓（协议单点：规范与向量同仓，transport/frame -update 生成）。
      # atlas 为私有仓：检出用只读 PAT（fine-grained，仅授 atlas 仓 Contents:Read），
      # 经 secrets.ATLAS_CI_TOKEN 注入；未配置时守卫步骤给出配置指引后失败。
      - name: 校验向量源仓访问凭证
        env:
          TOKEN_SET: ${{ secrets.ATLAS_CI_TOKEN != '' }}
        run: |
          if [ "$TOKEN_SET" != "true" ]; then
            echo "::error::secrets.ATLAS_CI_TOKEN 未配置：atlas 主仓为私有仓，CI 检出需要只读 PAT。"
            echo "::error::GitHub → Settings → Developer settings → Fine-grained tokens 新建（仅 atlas 仓，Contents: Read）"
            echo "::error::再到本仓 Settings → Secrets and variables → Actions 添加 ATLAS_CI_TOKEN，然后 Re-run 本工作流。"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: huangyuCN/atlas
          # pin 固定 sha：上游移动分支会让「重生成无 diff」门禁红绿不定，无法区分
          # 「我们忘了重生成」与「上游动了」。bump 时改这里（三仓同步）。
          ref: 08933f9ae854f66e196c38d2dead789511153e89
          path: atlas
          token: ${{ secrets.ATLAS_CI_TOKEN }}
      # 会话 DTO（契约消息）的协议源在模板仓 atlas-game-layout：gen-dto 门禁需要该检出。
      # 游戏域消息（battle/game/matcher）不在这里生成——它们由该仓的 protocol/ 包独立发布，
      # 本仓 go.mod 不 require 它（见 direct/gamedomain_guard_test.go 的边界守卫）。
      # 未配置凭证时守卫步骤给出配置指引后失败（与上一条同款只读 PAT 约定）。
      - name: 校验模板仓访问凭证
        env:
          TOKEN_SET: ${{ secrets.ATLAS_LAYOUT_CI_TOKEN != '' || secrets.ATLAS_CI_TOKEN != '' }}
        run: |
          if [ "$TOKEN_SET" != "true" ]; then
            echo "::error::模板仓 atlas-game-layout 为私有仓，「生成物无 diff」门禁需要检出它。"
            echo "::error::到本仓 Settings → Secrets and variables → Actions 添加 ATLAS_LAYOUT_CI_TOKEN"
            echo "::error::（fine-grained，含该仓 Contents: Read；或让 ATLAS_CI_TOKEN 同时覆盖模板仓），然后 Re-run。"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: huangyuCN/atlas-game-layout
          # pin 固定 sha（同 atlas）：bump 时与 atlas 的 ref 一起改。
          ref: d0b0451a782428f4ae77b8bc3a16629b9b8269a8
          path: atlas-game-layout
          token: ${{ secrets.ATLAS_LAYOUT_CI_TOKEN || secrets.ATLAS_CI_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      # protoc 版本必须与入库生成物的头部记录一致（生成物含 «protoc vX.Y.Z» 注释），
      # 否则「重生成无 diff」门禁必然误报。
      - name: 安装 protoc（libprotoc 26.1 → v5.26.1）
        uses: arduino/setup-protoc@v3
        with:
          version: '26.1'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: 生成物无 diff 门禁（帧常量 + 会话 DTO/stub 重生成后必须零改动）
        run: |
          bash scripts/gen-dto.sh
          # 整仓口径（与 p4 计划 V.1 一致，比 git diff --exit-code 更严：未跟踪的新产物
          # 同样算改动；产物落 api/** 与 frame/gen，不在 examples/smoke 下）。
          # 上游两仓检出在本仓工作区内（path: atlas / atlas-game-layout），其未跟踪目录
          # 不代表本仓产物改动，必须排除（':!' 为 git pathspec 排除语法）。
          if [ -n "$(git status --porcelain -- . ':!atlas' ':!atlas-game-layout')" ]; then
            echo "::error::重生成产生未入库改动（生成物与上游不同源）"
            git status --porcelain -- . ':!atlas' ':!atlas-game-layout'
            exit 1
          fi
      - name: gofmt 检查
        run: |
          # 排除上游检出目录（本仓工作区内的 CI 依赖树）：上游自身的格式问题不应让本仓 CI 变红。
          out="$(gofmt -l . | grep -vE '^(third_party|atlas|atlas-game-layout)/' || true)"
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: 命名规范检查（导出标识符不得以包名开头）
        run: go run ./scripts/check-pkgname . ./scripts/check-pkgname/allowlist.txt atlas/ atlas-game-layout/
      - name: Go doc 注释规范检查（首词=声明名等，违规退出码 1）
        run: go run ./scripts/go-comment-lint .
      - name: 单测 + golden vectors
        run: go test ./... -count=1 -race -timeout 5m
        env:
          ATLAS_GOLDEN_DIR: ${{ github.workspace }}/atlas/testdata/golden
      - name: 构建
        run: go build ./...
