name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: gofmt 检查
        run: |
          out="$(gofmt -l . | grep -v '^third_party/' || true)"
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: 单测 + golden vectors
        run: go test ./... -count=1 -race -timeout 5m
      - name: 构建
        run: go build ./...
